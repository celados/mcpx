name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.1.0'
        required: true
        type: string

# Tag pushes are already unique, but two tags landing together would
# publish concurrently — serialize the whole workflow, never cancel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: celados-linux
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.5

      - run: cp .npmrc.tpl .npmrc
      - run: bun install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun run check
        env:
          FIRECRAWL_API_KEY: test
          LINEAR_API_KEY: test
      - run: bun run build

      - name: Create release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/mcpx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
