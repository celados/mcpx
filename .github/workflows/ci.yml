name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes this run: checks are
# side-effect free, so cancelling the stale one costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: cp .npmrc.tpl .npmrc
      - run: bun install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun --version
      - run: bun run check
      - run: bun run build
      - run: bun run test
        env:
          FIRECRAWL_API_KEY: test
          LINEAR_API_KEY: test
